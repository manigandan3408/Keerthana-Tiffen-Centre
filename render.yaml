# Render Blueprint: deploys the Vite app as a static site.
# Render dashboard -> New -> Blueprint -> pick this repository.
# No environment variables are needed.
services:
  - type: web
    name: keerthana-tiffin-review
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
    routes:
      # Single-page-app routing: /qr must reload correctly.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
